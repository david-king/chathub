name: Build browser extension

on:
  push:
    branches:
      - feat/grok-account-webapp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension
        run: yarn build

      - name: Create extension zip
        run: |
          cd dist
          zip -r ../chathub-grok-browser-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chathub-grok-browser-extension
          path: |
            dist/**
            chathub-grok-browser-extension.zip
          if-no-files-found: error
